<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email & Password Validator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Sign Up</h1>

    <!-- novalidate turns off the browser's built-in checks, so only YOUR JavaScript validates -->
    <form id="form" novalidate autocomplete="off">

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="off">
        <span class="error" id="emailError"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <span class="error" id="passwordError"></span>
      </div>

      <button type="submit">Submit</button>

      <p class="message" id="message"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
